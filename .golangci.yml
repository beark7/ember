version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - revive
    - misspell
    - gosec
    - bodyclose
    - noctx
    - errorlint
    - unconvert
    - unparam
    - nolintlint
  settings:
    revive:
      rules:
        - name: package-comments
        - name: exported
        - name: var-naming
        - name: error-strings
        - name: error-naming
        - name: context-as-argument
    nolintlint:
      require-explanation: true
      require-specific: true
    gosec:
      excludes:
        - G304 # file paths come from validated config; reviewed per call site
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/beark7/ember
